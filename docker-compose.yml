services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lisa}
      POSTGRES_DB: ${POSTGRES_DB:-lisa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lisa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    image: lisa-backend:local
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD:-lisa}@postgres:5432/${POSTGRES_DB:-lisa}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: lisa-backend:local
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD:-lisa}@postgres:5432/${POSTGRES_DB:-lisa}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      ML_MODELS_DIR: /models
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      BUILDABLE_OS: ${BUILDABLE_OS:-["linux"]}
      # Where the deploy service finds the committed Ansible playbook (mounted
      # below). With ansible-core in the image, "Deploy to hosts" runs for real.
      LISA_ANSIBLE_DIR: /opt/lisa/ansible
    ports:
      - "8000:8000"
    volumes:
      - models:/models
      # Bind a host dir (not a named volume) so an out-of-container build
      # worker (macOS/Windows) can share it — set LISA_BUILDS_DIR to the same
      # path when running such a worker. Defaults to ./.builds in the repo.
      - ${LISA_BUILDS_DIR:-./.builds}:/var/lisa/builds
      # The deployment playbook/role, read-only, so the panel's "Deploy to
      # hosts" can run ansible-playbook against your target machines.
      - ./deploy/ansible:/opt/lisa/ansible:ro
      # To deploy over SSH, give the backend a key that can reach your hosts,
      # e.g. uncomment and point at your key:
      # - ${LISA_SSH_KEY:-~/.ssh/id_ed25519}:/root/.ssh/id_ed25519:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  builder:
    image: lisa-backend:local
    build: ./backend
    platform: linux/amd64
    # Install the agent's runtime deps into the build image before draining the
    # queue, so Nuitka bundles them into the compiled agent. The agent source
    # (with requirements.txt) is bind-mounted read-only at /agent-src.
    command: ["sh", "-c", "pip install --no-cache-dir -r /agent-src/requirements.txt && python -m app.services.agent_builder"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD:-lisa}@postgres:5432/${POSTGRES_DB:-lisa}
      REDIS_URL: redis://redis:6379/0
      LISA_AGENT_SOURCE_ROOT: /agent-src/lisa_agent
      LISA_BACKEND_URL: ${LISA_BACKEND_URL:-http://backend:8000}
    volumes:
      - ./agent:/agent-src:ro
      - ${LISA_BUILDS_DIR:-./.builds}:/var/lisa/builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  trainer:
    build: ./ml
    command:
      - lisa-ml-retrain
      - --backend
      - http://backend:8000
      - --out
      - /models
      - --interval
      - "${RETRAIN_INTERVAL:-3600}"
    volumes:
      - models:/models
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  models:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lisa}
      POSTGRES_DB: ${POSTGRES_DB:-lisa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lisa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    image: lisa-backend:local
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD:-lisa}@postgres:5432/${POSTGRES_DB:-lisa}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: lisa-backend:local
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lisa}:${POSTGRES_PASSWORD:-lisa}@postgres:5432/${POSTGRES_DB:-lisa}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      ML_MODELS_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  trainer:
    build: ./ml
    command:
      - lisa-ml-retrain
      - --backend
      - http://backend:8000
      - --out
      - /models
      - --interval
      - "${RETRAIN_INTERVAL:-3600}"
    volumes:
      - models:/models
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  models:

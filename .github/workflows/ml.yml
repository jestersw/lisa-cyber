name: ml

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'

defaults:
  run:
    working-directory: ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -v

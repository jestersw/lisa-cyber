# Example inventory for deploying LISA agents.
#
# One agent per host. Set `lisa_agent_id` per host to the agent the backend
# built for that machine (the ID returned by POST /api/agents/generate, e.g.
# USR1234567). Copy this file to inventory.ini and edit for your range.

[lisa_linux]
web01.corp.local lisa_agent_id=USR1000001
db01.corp.local  lisa_agent_id=USR1000002

[lisa_macos]
mac-finance.corp.local lisa_agent_id=USR1000003

[lisa_linux:vars]
ansible_user=operator
# The Linux installer writes to /opt/lisa, so it needs privilege escalation.
ansible_become=true

[lisa_macos:vars]
ansible_user=operator
# macOS installs per-user under ~/Library — no root needed.
ansible_become=false
